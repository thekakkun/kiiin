<!doctype html>
<html>
  <head>
    <title>Kiiin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        font-family: "Space Mono", "IBM Plex Sans JP";
        margin: 0;
      }

      @media (prefers-reduced-motion: no-preference) {
        html {
          interpolate-size: allow-keywords;
        }
      }

      body {
        line-height: 1;
        -webkit-font-smoothing: antialiased;
      }

      img,
      picture,
      video,
      canvas,
      svg {
        display: block;
        max-width: 100%;
      }

      input,
      button,
      textarea,
      select {
        font: inherit;
      }

      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        overflow-wrap: break-word;
      }

      p {
        text-wrap: pretty;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        text-wrap: balance;
      }

      #root,
      #__next {
        isolation: isolate;
      }

      body {
        height: 1027px;
        width: 1448px;
        padding: 20px;
        font-family: monospace;
      }

      #arrow text {
        fill: #fff;
        font-size: 25px;
      }

      #music .track .title {
        font-weight: bold;
      }

      #music .track .artist {
        font-weight: bold;
        color: #444;
      }

      #music #current {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
      }

      #music #cover {
        flex: 0 0 350px;
      }

      #music #cover img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }

      #music #current .track .title {
        font-size: 75px;
        margin-bottom: 10px;
      }

      #music #current .track .artist {
        font-size: 50px;
        margin-bottom: 10px;
      }

      #music #current .track .album {
        font-size: 40px;
      }

      #music #next {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #music #next .track {
        flex: 1;
        font-size: 35px;
        line-height: 1.15;
      }
    </style>
  </head>

  <body>
    <section id="weather"></section>

    <section id="music">{{ music_html | safe}}</section>
  </body>
</html>
