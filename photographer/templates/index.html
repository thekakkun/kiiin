<!DOCTYPE html>
<html>

<head>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        * {
            margin: 0;
        }

        @media (prefers-reduced-motion: no-preference) {
            html {
                interpolate-size: allow-keywords;
            }
        }

        body {
            line-height: 1;
            -webkit-font-smoothing: antialiased;
        }

        img,
        picture,
        video,
        canvas,
        svg {
            display: block;
            max-width: 100%;
        }

        input,
        button,
        textarea,
        select {
            font: inherit;
        }

        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            overflow-wrap: break-word;
        }

        p {
            text-wrap: pretty;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            text-wrap: balance;
        }

        #root,
        #__next {
            isolation: isolate;
        }

        body {
            padding: 10px;
        }

        #music {
            height: 1027px;
            width: 1448px;
            font-family: monospace;
        }

        .track .title {
            font-weight: bold;
        }

        .track .artist {
            font-weight: bold;
            color: #444;
        }

        .track .album .date {
            font-style: italic;
        }

        #current {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        #cover {
            flex: 0 0 350px;
        }

        #cover img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #current .track .title {
            font-size: 75px;
            margin-bottom: 10px;
        }

        #current .track .artist {
            font-size: 50px;
            margin-bottom: 10px;
        }

        #current .track .album {
            font-size: 40px;
        }

        #next {
            display: flex;
            align-items: center;
        }

        #next .arrow {
            font-size: 25px;
            width: 100px;
            height: 40px;
            position: relative;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 30px;
            padding-left: 5px;
        }

        #next .arrow::before {
            content: "";
            position: absolute;
            right: -20px;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 20px solid #000;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
        }

        #next .track {
            font-size: 35px;
            line-height: 1.15;
        }
    </style>
</head>

<body>
    <section id="weather">
    </section>

    <section id="music">
        {{ music_html | safe}}
    </section>
</body>

</html>
