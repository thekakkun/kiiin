<!doctype html>
<html>
  <head>
    <title>Kiiin Dashboard</title>
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        src: url(data:font/woff2;base64,{{ fonts.plex_sans_var }}) format("woff2-variations");
        font-weight: 100 700;
        font-style: normal;
      }

      @font-face {
        font-family: "IBM Plex Sans";
        src: url(data:font/woff2;base64,{{ fonts.plex_sans_var_italic }}) format("woff2-variations");
        font-weight: 100 700;
        font-style: italic;
      }
      {% include "styles/reset.css" %}
      {% include "styles/layout.css" %}
      {% include "styles/music.css" %}
      {% include "styles/weather.css" %}
    </style>
  </head>

  <body>
    {% if let Some(weather) = weather %}
    <section id="weather">{{ weather | safe }}</section>
    {% endif %}
    {% if let Some(music) = music %}
    <section id="music">{{ music | safe }}</section>
    {% endif %}
  </body>
</html>
