<!DOCTYPE html>
<html>

<head>
    <style>
        /* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td,
        article,
        aside,
        canvas,
        details,
        embed,
        figure,
        figcaption,
        footer,
        header,
        hgroup,
        menu,
        nav,
        output,
        ruby,
        section,
        summary,
        time,
        mark,
        audio,
        video {
            margin: 0;
            padding: 0;
            border: 0;
            font-size: 100%;
            font: inherit;
            vertical-align: baseline;
        }

        /* HTML5 display-role reset for older browsers */
        article,
        aside,
        details,
        figcaption,
        figure,
        footer,
        header,
        hgroup,
        menu,
        nav,
        section {
            display: block;
        }

        body {
            line-height: 1;
        }

        ol,
        ul {
            list-style: none;
        }

        blockquote,
        q {
            quotes: none;
        }

        blockquote:before,
        blockquote:after,
        q:before,
        q:after {
            content: '';
            content: none;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
        }

        body {
            padding: 10px;
        }

        #music {
            height: 1027px;
            width: 1448px;
            background-color: yellow;
            font-family: monospace;
        }

        .track .title {
            font-weight: bold;
        }

        .track .artist {
            font-weight: bold;
            color: #444;
        }

        .track .album .date {
            font-style: italic;
        }

        #current {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        #cover {
            flex: 0 0 350px;
        }

        #cover img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #current .track .title {
            font-size: 75px;
            margin-bottom: 10px;
        }

        #current .track .artist {
            font-size: 50px;
            margin-bottom: 10px;
        }

        #current .track .album {
            font-size: 40px;
        }

        #next {
            display: flex;
            align-items: center;
        }

        #next .arrow {
            font-size: 25px;
            width: 100px;
            height: 40px;
            position: relative;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 30px;
            padding-left: 5px;
        }

        #next .arrow::before {
            content: "";
            position: absolute;
            right: -20px;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 20px solid #000;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
        }

        #next .track {
            font-size: 35px;
            line-height: 1.15;
        }
    </style>
</head>

<body>
    <section id="weather">
    </section>

    <section id="music">
        {{ music_html | safe}}
    </section>
</body>

</html>
